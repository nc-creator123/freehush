<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="t d"><title id="t">Free processing per month vs a weekly 60-minute show</title><desc id="d">On a 0 to 30 hour monthly scale: Adobe Enhance free about 30 hours (1 hour a day times 30 days); Auphonic free 2 hours; Descript free 1 hour; Cleanvoice 0.5 hours, one time. A marker at 4 hours is the load of four 60-minute episodes.</desc><rect width="800" height="560" fill="#ffffff"></rect><text x="40" y="58" font-family="'Gabarito','Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="#13261b" text-anchor="start">Free hours a month vs a weekly show</text><text x="40" y="92" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#54695c" text-anchor="start">Scale 0–30 h · daily caps × 30 days, totals printed</text><text x="40" y="170" font-family="'Gabarito','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#13261b" text-anchor="start">Adobe Enhance</text><rect x="250" y="140" width="500" height="42" rx="10" fill="#e3efe6"></rect><rect x="250" y="140" width="500.00000000000006" height="42" rx="10" fill="#0c7a3d"></rect><text x="266" y="169" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="start">30 h (1 h × 30 days)</text><text x="40" y="248" font-family="'Gabarito','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#13261b" text-anchor="start">Auphonic</text><rect x="250" y="218" width="500" height="42" rx="10" fill="#e3efe6"></rect><rect x="250" y="218" width="33.333333333333336" height="42" rx="10" fill="#3c5344"></rect><text x="330.6666666666667" y="247" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#13261b" text-anchor="start">2 h</text><text x="40" y="326" font-family="'Gabarito','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#13261b" text-anchor="start">Descript</text><rect x="250" y="296" width="500" height="42" rx="10" fill="#e3efe6"></rect><rect x="250" y="296" width="16.666666666666668" height="42" rx="10" fill="#3c5344"></rect><text x="330.6666666666667" y="325" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#13261b" text-anchor="start">1 h</text><text x="40" y="404" font-family="'Gabarito','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#13261b" text-anchor="start">Cleanvoice</text><rect x="250" y="374" width="500" height="42" rx="10" fill="#e3efe6"></rect><rect x="250" y="374" width="8.333333333333334" height="42" rx="10" fill="#3c5344"></rect><text x="330.6666666666667" y="403" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#13261b" text-anchor="start">0.5 h, once</text><line x1="316.6666666666667" y1="124" x2="316.6666666666667" y2="444" stroke="#13261b" stroke-width="2.5" stroke-dasharray="6 5"></line><text x="312.6666666666667" y="470" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#13261b" text-anchor="start">4 h = four 60-min episodes</text><text x="250.0" y="502" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#54695c" text-anchor="middle">0 h</text><text x="416.6666666666667" y="502" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#54695c" text-anchor="middle">10 h</text><text x="583.3333333333334" y="502" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#54695c" text-anchor="middle">20 h</text><text x="750.0" y="502" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#54695c" text-anchor="middle">30 h</text><text x="40" y="538" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#54695c" text-anchor="start">Only Adobe's free tier clears the load. Caps read Oct 9, 2026.</text></svg>
