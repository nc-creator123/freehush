<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650" role="img" aria-labelledby="t d"><title id="t">Nine years of RNNoise</title><desc id="d">Sep 2017 RNNoise announced by Xiph. Sep 2020 OBS 26.0 adds RNNoise. Jun 2022 NoiseTorch's last release. Apr 2024 RNNoise 0.2. May 2024 werman plugin v1.10 stable. May 2026 plugin v1.21 pre-release.</desc><rect width="800" height="650" fill="#ffffff"></rect><text x="40" y="58" font-family="'Gabarito','Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#13261b" text-anchor="start">Nine years of RNNoise</text><text x="40" y="92" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#54695c" text-anchor="start">From research demo to the default in OBS</text><line x1="150" y1="130" x2="150" y2="550" stroke="#13261b" stroke-width="2"></line><circle cx="150" cy="140" r="11" fill="#0c7a3d" stroke="#13261b" stroke-width="1.5"></circle><text x="126" y="148" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#13261b" text-anchor="end">Sep 2017</text><rect x="178" y="114" width="560" height="52" rx="14" fill="#f2f7f3" stroke="#13261b" stroke-width="1.5"></rect><text x="198" y="148" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#13261b" text-anchor="start">RNNoise published by Xiph</text><circle cx="150" cy="220" r="11" fill="#0c7a3d" stroke="#13261b" stroke-width="1.5"></circle><text x="126" y="228" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#13261b" text-anchor="end">Sep 2020</text><rect x="178" y="194" width="560" height="52" rx="14" fill="#f2f7f3" stroke="#13261b" stroke-width="1.5"></rect><text x="198" y="228" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#13261b" text-anchor="start">OBS 26.0 makes it a filter method</text><circle cx="150" cy="300" r="11" fill="#0c7a3d" stroke="#13261b" stroke-width="1.5"></circle><text x="126" y="308" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#13261b" text-anchor="end">Jun 2022</text><rect x="178" y="274" width="560" height="52" rx="14" fill="#f2f7f3" stroke="#13261b" stroke-width="1.5"></rect><text x="198" y="308" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#13261b" text-anchor="start">NoiseTorch's last release</text><circle cx="150" cy="380" r="11" fill="#0c7a3d" stroke="#13261b" stroke-width="1.5"></circle><text x="126" y="388" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#13261b" text-anchor="end">Apr 2024</text><rect x="178" y="354" width="560" height="52" rx="14" fill="#f2f7f3" stroke="#13261b" stroke-width="1.5"></rect><text x="198" y="388" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#13261b" text-anchor="start">RNNoise 0.2: faster, public data</text><circle cx="150" cy="460" r="11" fill="#0c7a3d" stroke="#13261b" stroke-width="1.5"></circle><text x="126" y="468" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#13261b" text-anchor="end">May 2024</text><rect x="178" y="434" width="560" height="52" rx="14" fill="#f2f7f3" stroke="#13261b" stroke-width="1.5"></rect><text x="198" y="468" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#13261b" text-anchor="start">plugin v1.10, last stable</text><circle cx="150" cy="540" r="11" fill="#0c7a3d" stroke="#13261b" stroke-width="1.5"></circle><text x="126" y="548" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#13261b" text-anchor="end">May 2026</text><rect x="178" y="514" width="560" height="52" rx="14" fill="#f2f7f3" stroke="#13261b" stroke-width="1.5"></rect><text x="198" y="548" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#13261b" text-anchor="start">plugin v1.21 pre-release</text><text x="40" y="626" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#54695c" text-anchor="start">Sources: GitHub release history; OBS release notes; read Oct 10, 2026.</text></svg>
