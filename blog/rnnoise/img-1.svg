<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-labelledby="t d"><title id="t">How RNNoise handles one frame</title><desc id="d">48 kHz audio is split into 22 Bark-scale bands with 10 ms of look-ahead; a small GRU recurrent network reads band energies and pitch information; it outputs 22 per-band gains; gains plus a pitch filter give the cleaner frame.</desc><rect width="800" height="640" fill="#ffffff"></rect><text x="40" y="58" font-family="'Gabarito','Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#13261b" text-anchor="start">How RNNoise handles one frame</text><text x="40" y="92" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#54695c" text-anchor="start">Classic DSP around one small neural network</text><rect x="130" y="116" width="540" height="74" rx="16" fill="#f2f7f3" stroke="#13261b" stroke-width="1.5"></rect><text x="160" y="149" font-family="'Gabarito','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#13261b" text-anchor="start">Noisy audio</text><text x="160" y="176" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#3c5344" text-anchor="start">48 kHz · 10 ms look-ahead</text><line x1="400" y1="190" x2="400" y2="210" stroke="#13261b" stroke-width="2.5"></line><path d="M400,210 L394.8,199.2 L405.2,199.2 Z" fill="#13261b"></path><rect x="130" y="212" width="540" height="74" rx="16" fill="#f2f7f3" stroke="#13261b" stroke-width="1.5"></rect><text x="160" y="245" font-family="'Gabarito','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#13261b" text-anchor="start">22 bands</text><text x="160" y="272" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#3c5344" text-anchor="start">energies on a Bark scale + pitch</text><line x1="400" y1="286" x2="400" y2="306" stroke="#13261b" stroke-width="2.5"></line><path d="M400,306 L394.8,295.2 L405.2,295.2 Z" fill="#13261b"></path><rect x="130" y="308" width="540" height="74" rx="16" fill="#e8f5eb" stroke="#13261b" stroke-width="1.5"></rect><text x="160" y="341" font-family="'Gabarito','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#0c7a3d" text-anchor="start">Small GRU network</text><text x="160" y="368" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#3c5344" text-anchor="start">the only learned step</text><line x1="400" y1="382" x2="400" y2="402" stroke="#13261b" stroke-width="2.5"></line><path d="M400,402 L394.8,391.2 L405.2,391.2 Z" fill="#13261b"></path><rect x="130" y="404" width="540" height="74" rx="16" fill="#f2f7f3" stroke="#13261b" stroke-width="1.5"></rect><text x="160" y="437" font-family="'Gabarito','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#13261b" text-anchor="start">22 gains</text><text x="160" y="464" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#3c5344" text-anchor="start">turn noisy bands down</text><line x1="400" y1="478" x2="400" y2="498" stroke="#13261b" stroke-width="2.5"></line><path d="M400,498 L394.8,487.2 L405.2,487.2 Z" fill="#13261b"></path><rect x="130" y="500" width="540" height="74" rx="16" fill="#fbefd6" stroke="#13261b" stroke-width="1.5"></rect><text x="160" y="533" font-family="'Gabarito','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#13261b" text-anchor="start">Cleaner frame</text><text x="160" y="560" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#3c5344" text-anchor="start">gains + pitch filter applied</text><text x="40" y="610" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#54695c" text-anchor="start">Source: jmvalin.ca/demo/rnnoise (J.-M. Valin, 2017), read Oct 10, 2026.</text></svg>
