<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d"><title id="t">Choose by the job, not the plugin</title><desc id="d">Live audio in OBS: OBS built-in RNNoise or a VST2 plugin. Live calls in many apps: NVIDIA Broadcast on RTX, or Krisp after a 7-day trial. Recorded file with an editor: a VST3 plugin or the editor's own noise reduction. Recorded file, no install: Adobe Podcast Enhance 1 hour a day, or Auphonic 2 hours a month.</desc><rect width="800" height="600" fill="#ffffff"></rect><text x="40" y="58" font-family="'Gabarito','Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="#13261b" text-anchor="start">Choose by the job, not the plugin</text><text x="40" y="92" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#54695c" text-anchor="start">Start with what the audio is, then where it lives</text><rect x="40" y="120" width="340" height="64" rx="16" fill="#13261b"></rect><text x="210" y="161" font-family="'Gabarito','Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">Live while you talk</text><rect x="420" y="120" width="340" height="64" rx="16" fill="#13261b"></rect><text x="590" y="161" font-family="'Gabarito','Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">Already recorded</text><line x1="210" y1="184" x2="210" y2="214" stroke="#13261b" stroke-width="2.5"></line><path d="M210,214 L204.8,203.2 L215.2,203.2 Z" fill="#13261b"></path><rect x="40" y="220" width="340" height="134" rx="18" fill="#e8f5eb" stroke="#13261b" stroke-width="1.5"></rect><text x="64" y="262" font-family="'Gabarito','Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#13261b" text-anchor="start">Only in OBS</text><text x="64" y="300" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#3c5344" text-anchor="start">built-in RNNoise, or a</text><text x="64" y="328" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#3c5344" text-anchor="start">VST2 plugin · $0</text><line x1="210" y1="354" x2="210" y2="384" stroke="#13261b" stroke-width="2.5"></line><path d="M210,384 L204.8,373.2 L215.2,373.2 Z" fill="#13261b"></path><rect x="40" y="390" width="340" height="134" rx="18" fill="#fbefd6" stroke="#13261b" stroke-width="1.5"></rect><text x="64" y="432" font-family="'Gabarito','Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#13261b" text-anchor="start">Calls in every app</text><text x="64" y="470" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#3c5344" text-anchor="start">NVIDIA Broadcast (RTX) $0,</text><text x="64" y="498" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#3c5344" text-anchor="start">or Krisp after 7-day trial</text><line x1="590" y1="184" x2="590" y2="214" stroke="#13261b" stroke-width="2.5"></line><path d="M590,214 L584.8,203.2 L595.2,203.2 Z" fill="#13261b"></path><rect x="420" y="220" width="340" height="134" rx="18" fill="#e8f5eb" stroke="#13261b" stroke-width="1.5"></rect><text x="444" y="262" font-family="'Gabarito','Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#13261b" text-anchor="start">You have an editor</text><text x="444" y="300" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#3c5344" text-anchor="start">a VST3 plugin, or the</text><text x="444" y="328" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#3c5344" text-anchor="start">editor's own NR · $0</text><line x1="590" y1="354" x2="590" y2="384" stroke="#13261b" stroke-width="2.5"></line><path d="M590,384 L584.8,373.2 L595.2,373.2 Z" fill="#13261b"></path><rect x="420" y="390" width="340" height="134" rx="18" fill="#e8f5eb" stroke="#13261b" stroke-width="1.5"></rect><text x="444" y="432" font-family="'Gabarito','Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#13261b" text-anchor="start">No install wanted</text><text x="444" y="470" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#3c5344" text-anchor="start">Adobe Enhance 1 h/day,</text><text x="444" y="498" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#3c5344" text-anchor="start">Auphonic 2 h/month · $0</text><text x="40" y="566" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#54695c" text-anchor="start">Caps and prices read Oct 9, 2026.</text></svg>
