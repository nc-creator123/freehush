<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-labelledby="t d"><title id="t">Which host loads which plugin format</title><desc id="d">OBS: VST 2.x only; fits RNNoise plugin, TL NoiseReducer, ReaFIR; not Bertom. Audacity 4: VST3, LV2 on Linux, AU on macOS; fits RNNoise plugin, Bertom, TL. REAPER: VST, VST3, LV2, AU, CLAP; fits all; 60-day evaluation then $60 licence. DaVinci Resolve free: has its own Fairlight Noise Reduction; Voice Isolation needs Studio at $295.</desc><rect width="800" height="640" fill="#ffffff"></rect><text x="40" y="58" font-family="'Gabarito','Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="#13261b" text-anchor="start">Which host loads which plugin</text><text x="40" y="92" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#54695c" text-anchor="start">Format support read Oct 10, 2026</text><rect x="40" y="116" width="720" height="112" rx="18" fill="#f2f7f3" stroke="#13261b" stroke-width="1.5"></rect><circle cx="68" cy="146" r="8" fill="#ffffff" stroke="#13261b" stroke-width="1.5"></circle><text x="90" y="156" font-family="'Gabarito','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#13261b" text-anchor="start">OBS Studio</text><text x="90" y="196" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#3c5344" text-anchor="start">VST 2.x only</text><text x="470" y="156" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#0a6a35" text-anchor="start">RNNoise · TL · ReaFIR</text><text x="470" y="196" font-family="'Be Vietnam Pro','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#3c5344" text-anchor="start">not Bertom (no VST2)</text><rect x="40" y="240" width="720" height="112" rx="18" fill="#f2f7f3" stroke="#13261b" stroke-width="1.5"></rect